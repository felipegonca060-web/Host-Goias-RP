<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SA-MP Cloud Host v0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070c17;color:#eef3ff;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.card{background:#111a2d;border:1px solid #273654;border-radius:16px;padding:18px;margin:15px 0}.muted{color:#94a1b8}input,textarea{width:100%;background:#091120;color:#fff;border:1px solid #34435e;border-radius:9px;padding:11px;margin:5px 0 12px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#635bff;color:#fff;font-weight:bold;cursor:pointer;margin:3px}.gray{background:#293650}.red{background:#a7374e}.badge{padding:5px 9px;border-radius:20px;font-size:12px}.on{background:#123c2c;color:#5ce7a1}.off{background:#3c1c26;color:#ff91a0}.console{background:#050914;border-radius:10px;padding:12px;white-space:pre-wrap;height:250px;overflow:auto;font:12px monospace}.center{max-width:420px;margin:10vh auto}.hidden{display:none}.file{padding:7px;border-bottom:1px solid #273654}
</style></head><body><div class="wrap">
<div id="auth" class="center card"><h1>🎮 SA-MP Cloud Host</h1><p class="muted">Hospedagem e gerenciamento de servidores.</p><input id="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button class="btn" onclick="login()">Entrar</button><button class="btn gray" onclick="reg()">Criar conta</button><p id="msg" class="muted"></p></div>
<div id="app" class="hidden"><div class="top"><div><h1>SA-MP Cloud Host</h1><span id="who" class="muted"></span></div><button class="btn gray" onclick="logout()">Sair</button></div>
<div class="card"><button class="btn" onclick="create()">+ Criar servidor</button><button class="btn gray" onclick="adminStats()">Admin</button></div><div id="list" class="grid"></div></div>
</div>
<script>
let token=localStorage.getItem("samp_token");const $=x=>document.getElementById(x);
async function api(u,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json"};if(token)o.headers.Authorization="Bearer "+token;let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Erro");return d}
async function boot(){if(!token)return;try{let m=await api("/api/me");$("who").textContent=m.email;$("auth").classList.add("hidden");$("app").classList.remove("hidden");load()}catch{logout()}}
async function login(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("pass").value})});token=d.token;localStorage.setItem("samp_token",token);boot()}catch(e){$("msg").textContent=e.message}}
async function reg(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("pass").value})});token=d.token;localStorage.setItem("samp_token",token);boot()}catch(e){$("msg").textContent=e.message}}
function logout(){localStorage.removeItem("samp_token");location.reload()}
async function load(){let ss=await api("/api/servers");$("list").innerHTML=ss.length?ss.map(s=>`<div class="card"><div class="top"><h2>${esc(s.name)}</h2><span class="badge ${s.online?"on":"off"}">${s.online?"ONLINE":"OFFLINE"}</span></div><p class="muted">IP: ${location.hostname}:${s.port}</p><p class="muted">${esc(s.id)} · porta ${s.port}</p><button class="btn" onclick="act('${s.id}','start')">Iniciar</button><button class="btn gray" onclick="act('${s.id}','restart')">Reiniciar</button><button class="btn red" onclick="act('${s.id}','stop')">Parar</button><button class="btn gray" onclick="panel('${s.id}')">Console</button></div>`).join(""):`<div class="card"><p class="muted">Nenhum servidor.</p></div>`}
async function act(id,a){try{await api("/api/servers/"+id+"/action",{method:"POST",body:JSON.stringify({action:a})});load()}catch(e){alert(e.message)}}
async function create(){let id=prompt("ID:");if(!id)return;let name=prompt("Nome:","Goiás RolePlay"),port=Number(prompt("Porta:","7777"));try{await api("/api/servers",{method:"POST",body:JSON.stringify({id,name,port})});load()}catch(e){alert(e.message)}}
async function panel(id){let box=document.createElement("div");box.className="card";box.innerHTML="<h2>Console</h2><div class='console'>Carregando...</div><button class='btn gray'>Fechar</button>";document.querySelector(".wrap").appendChild(box);box.querySelector("button").onclick=()=>box.remove();async function refresh(){try{let d=await api("/api/servers/"+id+"/logs");box.querySelector(".console").textContent=d.logs||"Sem logs ainda.";box.querySelector(".console").scrollTop=999999}catch{}}refresh();let t=setInterval(()=>{if(!document.body.contains(box))return clearInterval(t);refresh()},1500)}
async function adminStats(){try{let d=await api("/api/admin/stats");alert(`Usuários: ${d.users}\nServidores: ${d.servers}\nOnline: ${d.online}`)}catch(e){alert(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
boot();
</script></body></html>
